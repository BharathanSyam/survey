<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code</title>
<meta name="robots" content="noindex">
<link rel="icon" href="v1/icon.svg">
<link rel="stylesheet" href="v1/app.css">
<style>
  .qr-wrap { text-align: center; }
  .qr-wrap canvas { width: 100%; max-width: 360px; height: auto; image-rendering: pixelated; border-radius: 12px; border: 1px solid var(--line); }
  .qr-url { font-size: .85em; word-break: break-all; color: var(--muted); margin: 10px 0 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media print { .noprint { display: none !important; } body { background: #fff; } .card { box-shadow: none; } .qr-wrap canvas { max-width: 70%; border: 0; } }
</style>
</head>
<body>
<main class="screen center">
  <div class="card qr-wrap">
    <h1 class="title sm" id="t">Scan to take part</h1>
    <canvas id="c" aria-label="QR code"></canvas>
    <p class="qr-url" id="u"></p>
    <div class="row noprint">
      <a class="btn" id="dl" download="qr.png">Download PNG</a>
      <button class="btn ghost" onclick="window.print()">Print</button>
    </div>
    <p class="small noprint">Made on this page; the link is never sent to any outside service.</p>
  </div>
</main>
<script src="v1/qr.js"></script>
<script>
  var p = new URLSearchParams(location.search);
  var url = p.get('u') || '', title = p.get('t');
  if (title) document.getElementById('t').textContent = title;
  document.getElementById('u').textContent = url || 'Add ?u=<link> to this page address.';
  if (url) {
    var c = document.getElementById('c');
    QR.draw(c, url, 1200, '#0B2A26');
    var a = document.getElementById('dl');
    a.href = c.toDataURL('image/png');
    a.download = 'qr-' + (url.split('/').pop().replace(/[^\w-]+/g, '_') || 'survey') + '.png';
  }
</script>
</body>
</html>
